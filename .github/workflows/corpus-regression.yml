name: Corpus Regression

on:
  pull_request:
    branches: [preprod, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  capture-contract-selftests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Producer-clock and buffered-identity regressions
        run: perl scripts/selftest-life-boundary.pl
      - name: Property-tail parse regressions
        run: perl scripts/selftest-getproperties.pl
      - name: Empty quoted field parses as absent
        run: perl scripts/selftest-getproperties-empty.pl
      - name: Frag-context certification and marker claim rules
        run: perl scripts/selftest-frag-context.pl
      - name: Damage-absence distinction
        run: perl scripts/selftest-damage-absence.pl
      - name: Schema-22 objective and grenade entity contracts
        run: perl scripts/selftest-telemetry22.pl

  migration-022-mysql:
    name: Migration 022 on production-parity MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/ktp-runtime-test-base:latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical ephemeral-MySQL harness
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/KTPInfrastructure
          ref: preprod
          path: KTPInfrastructure
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production-parity Lane B database image
        run: |
          docker pull "$BASE_IMAGE"
          docker build \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            -t ktp-lane-b:ci \
            -f KTPInfrastructure/build/lane-b/Dockerfile \
            KTPInfrastructure/build/lane-b
      - name: Migration 022 clean/rerun/repair/fail-closed contract
        run: |
          docker run --rm --network none \
            -v "${PWD}:/daemon:ro" \
            -v "${PWD}/KTPInfrastructure:/infra:ro" \
            ktp-lane-b:ci \
            python3 /daemon/scripts/selftest-migration22.py \
              --infrastructure-root /infra

  # Deliberately NOT a dependency of corpus-regression. Making the lane `needs:`
  # this would leave the required `corpus-regression / Lane B` context skipped
  # rather than failed, and a required check that never reports blocks the branch
  # instead of reporting on it.
  ref-pairing:
    name: Lane B refs pair with the harness lineage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate discriminates in both directions
        run: python3 scripts/check-lane-refs.py --selftest
      - name: Every ref but daemon_ref is a literal on the harness lineage
        run: python3 scripts/check-lane-refs.py

  corpus-regression:
    # Pinned to a commit sha, not `@preprod` -- a literal branch name still moves
    # every time someone pushes to it. The reusable workflow's inner job is named
    # `Lane B (${{ inputs.lane }}, ${{ matrix.target_ref }}, run ${{
    # matrix.run_index }})`, which composes the required status check
    # `corpus-regression / Lane B (corpus, preprod, run 1)` on this repo's `main`
    # and `preprod`. A rename of that job on preprod -- even one unrelated to
    # this repo -- would mean the required context can never report again, with
    # no failing check to point at: every PR would block forever. Pinning the sha
    # freezes which version of the reusable workflow's orchestration CODE runs,
    # so a later rename on preprod cannot reach us until the pin is moved on
    # purpose. Pinned to preprod's tip as of 2026-08-30 (KTPInfrastructure#201).
    uses: afraznein/KTPInfrastructure/.github/workflows/lane-b-stats-e2e.yml@3b6ac496c86d59ef81dd23a9c76193be312449d8
    with:
      lane: corpus
      # infrastructure_ref/amxx_ref stay the literal "preprod" -- that selects
      # which commit of KTPInfrastructure/KTPAMXX gets CHECKED OUT once the
      # pinned workflow code above is running, deliberately left live so the
      # harness content (fixtures, schema, bot driver) keeps tracking preprod.
      # Only the orchestration YAML is frozen. scripts/check-lane-refs.py no
      # longer compares these against the `uses:` pin (which can now be a sha
      # that no branch name equals) -- it compares them against the fixed
      # lineage name "preprod" instead.
      infrastructure_ref: preprod
      # Literal, not the PR's base ref. KTPAMXX is not the artifact under test
      # here — it is part of the stack the harness assembles, so it has to come
      # from the same lineage as the harness. See scripts/check-lane-refs.py.
      amxx_ref: preprod
      daemon_ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
